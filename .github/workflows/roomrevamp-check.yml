name: RoomRevamp checks
on:
  push:
    branches: ["roomrevamp/initial-build"]
  pull_request:
    paths:
      - "roomrevamp/**"
      - ".github/workflows/roomrevamp-check.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        working-directory: roomrevamp
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: roomrevamp
        run: npx playwright install --with-deps chromium
      - name: Check app JavaScript syntax
        run: node --check roomrevamp/app/app.js
      - name: Run desktop and mobile browser tests
        working-directory: roomrevamp
        run: npm test
      - name: Upload test report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roomrevamp-test-results
          path: |
            roomrevamp/testing/test-results/
          if-no-files-found: ignore
          retention-days: 14
